name: TD quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HTML assets and inline JavaScript
        run: |
          python3 scripts/check_site.py
      - name: Check service worker JavaScript
        run: node --check sw.js
